<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#FFD93B">
<title>TV 캐릭터 친구</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="stage">
  <svg id="face" viewBox="0 0 800 500" aria-label="캐릭터">
  <defs>
    <radialGradient id="irisG" cx=".5" cy=".7" r=".7"><stop offset="0" stop-color="#8a5a2b"/><stop offset=".45" stop-color="#4a2a14"/><stop offset="1" stop-color="#1e120a"/></radialGradient>
    <clipPath id="clipEye" clipPathUnits="userSpaceOnUse"><ellipse rx="80" ry="105"/></clipPath>
  </defs>
  <g id="root">
    <g id="blush" opacity=".5"><ellipse cx="190" cy="345" rx="55" ry="22" fill="#ff7a6b"/><ellipse cx="610" cy="345" rx="55" ry="22" fill="#ff7a6b"/></g>
    <g id="eyeL" transform="translate(260,220)">
      <g class="open"><g clip-path="url(#clipEye)"><ellipse rx="80" ry="105" fill="#1e120a"/>
        <g class="iris"><ellipse cy="10" rx="68" ry="88" fill="url(#irisG)"/><ellipse class="pupil" cy="10" rx="26" ry="36" fill="#120a05"/>
          <ellipse cx="-24" cy="-34" rx="24" ry="30" fill="#fff"/><circle cx="26" cy="34" r="12" fill="#fff"/><circle cx="-30" cy="44" r="6" fill="#fff" opacity=".85"/></g></g></g>
      <path class="happy" d="M-70 20 Q0 -70 70 20" fill="none" stroke="#1e120a" stroke-width="20" stroke-linecap="round" opacity="0"/>
      <path class="closed" d="M-72 0 Q0 50 72 0" fill="none" stroke="#1e120a" stroke-width="18" stroke-linecap="round" opacity="0"/>
    </g>
    <g id="eyeR" transform="translate(540,220)">
      <g class="open"><g clip-path="url(#clipEye)"><ellipse rx="80" ry="105" fill="#1e120a"/>
        <g class="iris"><ellipse cy="10" rx="68" ry="88" fill="url(#irisG)"/><ellipse class="pupil" cy="10" rx="26" ry="36" fill="#120a05"/>
          <ellipse cx="-24" cy="-34" rx="24" ry="30" fill="#fff"/><circle cx="26" cy="34" r="12" fill="#fff"/><circle cx="-30" cy="44" r="6" fill="#fff" opacity=".85"/></g></g></g>
      <path class="happy" d="M-70 20 Q0 -70 70 20" fill="none" stroke="#1e120a" stroke-width="20" stroke-linecap="round" opacity="0"/>
      <path class="closed" d="M-72 0 Q0 50 72 0" fill="none" stroke="#1e120a" stroke-width="18" stroke-linecap="round" opacity="0"/>
    </g>
    <path id="mouth" d="M370 370 Q400 392 430 370" fill="none" stroke="#1e120a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <text id="bang" x="660" y="110" font-size="130" font-weight="900" fill="#e8452c" opacity="0">!</text>
  </g>
</svg>
<div id="fx"></div>
  <div id="bubble">안녕하세요!</div>
  <div id="zzz"><span>Z</span><span>z</span><span>z</span></div>
</div>
<div id="tap">👆 화면을 눌러 시작하기<small>카메라·마이크를 켜려면 터치가 필요해요</small></div>
<div id="ui">
  <button id="btnFs">⛶ 전체화면</button>
  <button id="btnCam">📷 카메라 보기</button>
  <button id="btnMic">🎤 마이크 꺼짐</button>
  <span id="status">카메라 준비 중…</span>
</div>
<video id="video" autoplay muted playsinline></video>
<script type="module" src="app.js"></script>
</body></html>
